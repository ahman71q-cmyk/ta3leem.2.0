<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الاختبارات | Ta3leem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-mortarboard-fill fs-3"></i><span>Ta3leem</span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link fw-semibold" href="index.html">الرئيسية</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold" href="courses.html">الدورات</a></li>
          <li class="nav-item"><a class="nav-link active fw-semibold" href="quizzes.html"><i class="bi bi-clipboard-check"></i> الاختبارات</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold" href="presentations.html"><i class="bi bi-easel"></i> العروض</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-sm btn-outline-secondary border-0" onclick="toggleTheme()"><i class="bi bi-moon-stars" id="themeIcon"></i></button>
          <div id="guestButtons" class="d-flex gap-2">
            <a href="login.html" class="btn btn-sm btn-outline-primary px-3">دخول</a>
            <a href="register.html" class="btn btn-sm btn-primary px-3">إنشاء حساب</a>
          </div>
          <div id="userMenu" class="dropdown d-none">
            <button class="btn btn-sm btn-light dropdown-toggle" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle"></i><span id="userName">مستخدم</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="dashboard.html">لوحتي</a></li>
              <li><a class="dropdown-item" href="admin.html" id="adminLink">لوحة التحكم</a></li>
              <li><a class="dropdown-item text-danger" href="#" onclick="logout(event)">خروج</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <section class="py-5" style="background: var(--gradient-soft);">
    <div class="container">
      <h1 class="fw-bold mb-2"><i class="bi bi-clipboard-check"></i> الاختبارات</h1>
      <p class="text-muted mb-0">اختبر معرفتك وقيّم مستواك في كل دورة</p>
    </div>
  </section>

  <section class="py-5">
    <div class="container">
      <div class="row g-4" id="quizzesGrid">
        <div class="col-12 text-center py-5">
          <div class="spinner-border text-primary"></div>
        </div>
      </div>
    </div>
  </section>

  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center small text-white-50">© 2026 Ta3leem. جميع الحقوق محفوظة.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
  async function loadQuizzes() {
    const grid = document.getElementById("quizzesGrid");

    grid.innerHTML = `
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p class="text-muted mt-2">جاري تحميل الاختبارات...</p>
      </div>`;

    try {
      const quizzes = await getQuizzes();

      if (!quizzes || quizzes.length === 0) {
        grid.innerHTML = `
          <div class="col-12 text-center py-5">
            <i class="bi bi-clipboard-x fs-1 text-muted"></i>
            <h4 class="fw-bold mt-3">لا توجد اختبارات بعد</h4>
            <p class="text-muted">سيتم إضافة الاختبارات قريبًا.</p>
            <a href="courses.html" class="btn btn-primary">
              <i class="bi bi-book"></i> تصفح الدورات
            </a>
          </div>`;
        return;
      }

      // جيب الأسئلة لكل اختبار
      grid.innerHTML = quizzes.map((q) => `
        <div class="col-md-6 col-lg-4">
          <div class="card border-0 shadow-sm rounded-4 h-100">
            <div class="card-body p-4">
              <div class="icon-circle icon-secondary mx-auto mb-3" style="width:60px;height:60px;">
                <i class="bi bi-clipboard-check fs-4"></i>
              </div>
              <h5 class="fw-bold mb-2 text-center">${escapeHtml(q.title)}</h5>
              <p class="text-muted small text-center mb-3">${escapeHtml(q.course?.title || "")}</p>
              <div class="d-flex justify-content-between small text-muted mb-3">
                <span><i class="bi bi-clock"></i> ${q.time_limit_min || 15} دقيقة</span>
                <span>النجاح: <strong class="text-success">${q.pass_score || 60}%</strong></span>
              </div>
              <a href="quiz.html?id=${q.id}" class="btn btn-primary w-100">
                <i class="bi bi-play-circle"></i> ابدأ الاختبار
              </a>
            </div>
          </div>
        </div>
      `).join("");

    } catch (err) {
      console.error(err);
      grid.innerHTML = `
        <div class="col-12 text-center py-5">
          <i class="bi bi-exclamation-triangle fs-1 text-danger"></i>
          <p class="text-danger mt-2">فشل تحميل الاختبارات</p>
        </div>`;
    }
  }

  function toggleTheme() {
    const html = document.documentElement;
    const next = html.getAttribute("data-bs-theme") === "dark" ? "light" : "dark";
    html.setAttribute("data-bs-theme", next);
    localStorage.setItem("theme", next);
    document.getElementById("themeIcon").className = next === "dark" ? "bi bi-sun" : "bi bi-moon-stars";
  }

  (function () {
    const saved = localStorage.getItem("theme") || "light";
    document.documentElement.setAttribute("data-bs-theme", saved);
    document.addEventListener("DOMContentLoaded", () => {
      const i = document.getElementById("themeIcon");
      if (i) i.className = saved === "dark" ? "bi bi-sun" : "bi bi-moon-stars";
      loadQuizzes();
    });
  })();
</script>
</body>
</html>
