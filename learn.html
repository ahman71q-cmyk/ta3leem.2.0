<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التعلم | Ta3leem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0ea5e9">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <style>
    .learn-sidebar { background: #fff; border-left: 1px solid #e2e8f0; height: calc(100vh - 70px); overflow-y: auto; position: sticky; top: 70px; }
    .learn-content { padding: 2rem; min-height: calc(100vh - 70px); }
    .section-title { font-size: 0.8rem; text-transform: uppercase; color: #64748b; font-weight: 700; padding: 12px 16px; letter-spacing: 1px; }
    .lesson-nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-right: 3px solid transparent; color: #475569; text-decoration: none; transition: all 0.2s; cursor: pointer; }
    .lesson-nav-item:hover { background: #f1f5f9; }
    .lesson-nav-item.active { background: #e0f2fe; border-right-color: #0ea5e9; color: #0284c7; font-weight: 600; }
    .lesson-nav-item.completed { color: #059669; }
    .lesson-nav-item .check { color: #10b981; }
    .lesson-content { line-height: 1.9; font-size: 1.05rem; }
    .lesson-content h3 { margin-top: 1.5rem; color: #0284c7; }
    .lesson-content code { background: #f1f9fb; padding: 2px 6px; border-radius: 4px; color: #0369a1; }
    @media (max-width: 992px) {
      .learn-sidebar { height: auto; position: static; }
      .learn-content { padding: 1rem; }
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container-fluid px-lg-4">
      <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-mortarboard-fill fs-3"></i><span>Ta3leem</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <a href="dashboard.html" class="btn btn-sm btn-outline-primary"><i class="bi bi-speedometer2"></i> لوحتي</a>
        <div id="userMenu" class="dropdown d-none">
          <button class="btn btn-sm btn-light dropdown-toggle" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle"></i><span id="userName">مستخدم</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item text-danger" href="#" onclick="logout(event)">خروج</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <div class="container-fluid p-0">
    <div class="row g-0">
      <div class="col-lg-3 col-xl-3 order-lg-2">
        <div class="learn-sidebar" id="learnSidebar">
          <div class="p-3 border-bottom">
            <h6 class="fw-bold mb-1" id="courseName">جاري التحميل...</h6>
            <small class="text-muted">التقدم: <span id="progressPct">0%</span></small>
            <div class="progress mt-2" style="height: 6px;">
              <div class="progress-bar gradient-brand" id="progressBar" style="width: 0%"></div>
            </div>
          </div>
          <div id="sidebarItems"></div>
        </div>
      </div>

      <div class="col-lg-9 col-xl-9 order-lg-1">
        <div class="learn-content" id="learnContent">
          <div class="text-center py-5">
            <div class="spinner-border text-primary"></div>
            <p class="text-muted mt-2">جاري التحميل...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/files.js"></script>
  <script>
  let currentCourse = null;
  let currentUser = null;
  let currentItem = null;
  let allItems = [];

  async function initLearn() {
    currentUser = await requireAuth();
    if (!currentUser) return;

    const slug = new URLSearchParams(window.location.search).get("slug");
    if (!slug) {
      document.getElementById("learnContent").innerHTML =
        '<div class="alert alert-danger">لم يتم تحديد دورة</div>';
      return;
    }

    // ✅ جيب الدورة من Supabase
    currentCourse = await getCourseBySlug(slug);

    if (!currentCourse) {
      document.getElementById("learnContent").innerHTML =
        '<div class="alert alert-danger">الدورة غير موجودة</div>';
      return;
    }

    document.getElementById("courseName").textContent = currentCourse.title;

    // ✅ تحقق إن الطالب مسجل في الدورة
    const enrollments = await getEnrollments(currentUser.id);
    const isEnrolled = enrollments.some(e => e.course?.id === currentCourse.id);

    if (!isEnrolled && currentUser.role !== "admin") {
      document.getElementById("learnContent").innerHTML = `
        <div class="alert alert-warning text-center">
          <i class="bi bi-exclamation-triangle fs-1 d-block mb-3"></i>
          <h4>لم تسجل في هذه الدورة بعد</h4>
          <p>يجب التسجيل في الدورة أولاً للوصول إلى الدروس.</p>
          <a href="course.html?slug=${slug}" class="btn btn-primary">
            <i class="bi bi-person-plus"></i> سجّل الآن
          </a>
        </div>`;
      return;
    }

    allItems = [];

    // ✅ الدروس من sections
    (currentCourse.sections || []).forEach(s => {
      (s.lessons || []).forEach(l => {
        allItems.push({
          type: "lesson",
          id: l.id,
          title: l.title,
          duration: l.duration_min,
          content: l.content,
          section: s.title,
        });
      });
    });

    // ✅ العروض من Supabase
    const presentations = await getPresentationsByCourse(currentCourse.id);
    presentations.forEach(p => {
      allItems.push({
        type: "presentation",
        id: p.id,
        title: p.title,
        fileUrl: p.file_url,
        fileType: p.file_type,
        fileSize: p.file_size,
        fileName: p.file_name,
        section: "العروض التقديمية",
      });
    });

    // ✅ روابط Zoom من Supabase
    const zooms = await getZoomByCourse(currentCourse.id);
    zooms.forEach(z => {
      allItems.push({
        type: "zoom",
        id: z.id,
        title: z.title,
        url: z.url,
        date: z.date,
        section: "البث المباشر",
      });
    });

    // ✅ الاختبار من Supabase
    const quizzes = await getQuizzes({ courseId: currentCourse.id });
    if (quizzes.length > 0) {
      allItems.push({
        type: "quiz",
        id: quizzes[0].id,
        title: quizzes[0].title,
        timeLimit: quizzes[0].time_limit_min,
        section: "الاختبار النهائي",
      });
    }

    // ترتيب العناصر
    const order = { lesson: 1, presentation: 2, zoom: 3, quiz: 4 };
    allItems.sort((a, b) => (order[a.type] || 99) - (order[b.type] || 99));

    await renderSidebar();
    await updateProgress();

    if (allItems.length > 0) {
      await loadItem(allItems[0]);
    } else {
      document.getElementById("learnContent").innerHTML = `
        <div class="text-center py-5">
          <i class="bi bi-inbox fs-1 text-muted"></i>
          <h4 class="fw-bold mt-3">لا يوجد محتوى بعد</h4>
          <p class="text-muted">لم تتم إضافة دروس أو عروض لهذه الدورة.</p>
        </div>`;
    }
  }

  // ==========================================================
  // Sidebar
  // ==========================================================
  async function renderSidebar() {
    const grouped = {};
    allItems.forEach(item => {
      const sec = item.section || "المحتوى";
      if (!grouped[sec]) grouped[sec] = [];
      grouped[sec].push(item);
    });

    // جيب التقدم من Supabase
    const progress = await getLessonProgress(currentUser.id, currentCourse.id);
    const completedIds = new Set(progress.filter(p => p.completed).map(p => p.lesson_id));

    let html = "";
    Object.keys(grouped).forEach(secName => {
      html += `<div class="section-title">${escapeHtml(secName)}</div>`;
      grouped[secName].forEach(item => {
        const icon = getItemIcon(item.type);
        const isCompleted = item.type === "lesson" && completedIds.has(item.id);
        html += `
          <a href="#" class="lesson-nav-item ${isCompleted ? "completed" : ""}"
             data-type="${item.type}" data-id="${item.id}"
             onclick="loadItemFromClick(event, '${item.type}', ${item.id})">
            <i class="bi ${icon}"></i>
            <span class="flex-grow-1 small">${escapeHtml(item.title)}</span>
            ${isCompleted ? '<i class="bi bi-check-circle-fill check"></i>' : ''}
          </a>
        `;
      });
    });

    document.getElementById("sidebarItems").innerHTML = html;
  }

  function getItemIcon(type) {
    const icons = {
      lesson: "bi-file-text",
      presentation: "bi-easel",
      zoom: "bi-camera-video",
      quiz: "bi-clipboard-check",
    };
    return icons[type] || "bi-file";
  }

  function loadItemFromClick(e, type, id) {
    e.preventDefault();
    const item = allItems.find(i => i.type === type && i.id === id);
    if (item) loadItem(item);
  }

  // ==========================================================
  // Load Item
  // ==========================================================
  async function loadItem(item) {
    currentItem = item;
    document.querySelectorAll(".lesson-nav-item").forEach(el => el.classList.remove("active"));
    document.querySelectorAll(`.lesson-nav-item[data-type="${item.type}"][data-id="${item.id}"]`)
      .forEach(el => el.classList.add("active"));

    const container = document.getElementById("learnContent");

    // ---------- درس ----------
    if (item.type === "lesson") {
      const isCompleted = await isLessonComplete(currentUser.id, currentCourse.id, item.id);
      container.innerHTML = `
        <nav aria-label="breadcrumb" class="mb-3">
          <ol class="breadcrumb small">
            <li class="breadcrumb-item">
              <a href="course.html?slug=${currentCourse.slug}" class="text-decoration-none">
                ${escapeHtml(currentCourse.title)}
              </a>
            </li>
            <li class="breadcrumb-item active">${escapeHtml(item.title)}</li>
          </ol>
        </nav>
        <h2 class="h3 fw-bold mb-4">${escapeHtml(item.title)}</h2>
        <div class="lesson-content mb-4">${item.content || "<p class='text-muted'>لا يوجد محتوى</p>"}</div>
        <div class="d-flex justify-content-between align-items-center border-top pt-3">
          <button class="btn ${isCompleted ? 'btn-outline-success' : 'btn-success'}"
                  onclick="completeLesson()" ${isCompleted ? 'disabled' : ''}>
            <i class="bi bi-check-circle${isCompleted ? '-fill' : ''}"></i>
            ${isCompleted ? "تم إكمال الدرس" : "تم إكمال الدرس"}
          </button>
          <button class="btn btn-primary" onclick="goNext()">
            التالي <i class="bi bi-arrow-left"></i>
          </button>
        </div>
      `;
    }
    // ---------- عرض ----------
    else if (item.type === "presentation") {
      const icon = item.fileType === "pdf"
        ? "bi-file-earmark-pdf text-danger"
        : "bi-file-earmark-ppt text-warning";
      container.innerHTML = `
        <h2 class="h3 fw-bold mb-4"><i class="bi bi-easel text-primary"></i> ${escapeHtml(item.title)}</h2>
        <div class="card border-0 shadow-sm rounded-4 p-5 text-center">
          <i class="bi ${icon}" style="font-size: 5rem;"></i>
          <h4 class="mt-3">${escapeHtml(item.title)}</h4>
          <p class="text-muted">
            النوع: ${(item.fileType || "pdf").toUpperCase()} |
            الحجم: ${formatFileSize(item.fileSize || 0)}
          </p>
          <a href="${item.fileUrl}" target="_blank" class="btn btn-primary btn-lg mt-3">
            <i class="bi bi-box-arrow-up-right"></i> فتح العرض
          </a>
        </div>
      `;
    }
    // ---------- Zoom ----------
    else if (item.type === "zoom") {
      const dateStr = item.date ? new Date(item.date).toLocaleString("ar-EG") : "";
      container.innerHTML = `
        <h2 class="h3 fw-bold mb-4"><i class="bi bi-camera-video text-danger"></i> ${escapeHtml(item.title)}</h2>
        <div class="card border-0 shadow-sm rounded-4 p-5 text-center">
          <i class="bi bi-camera-video text-danger" style="font-size: 5rem;"></i>
          <h4 class="mt-3">جلسة مباشرة</h4>
          ${dateStr ? `<p class="text-muted">الموعد: ${dateStr}</p>` : ""}
          <a href="${escapeHtml(item.url)}" target="_blank" class="btn btn-danger btn-lg mt-3">
            <i class="bi bi-box-arrow-up-right"></i> انضم للجلسة
          </a>
        </div>
      `;
    }
    // ---------- اختبار ----------
    else if (item.type === "quiz") {
      const attempts = await getAttemptsByUser(currentUser.id);
      const quizAttempts = attempts.filter(a => a.quiz_id === item.id);
      const bestScore = quizAttempts.length > 0
        ? Math.max(...quizAttempts.map(a => a.total_points > 0
            ? Math.round((a.score / a.total_points) * 100) : 0))
        : null;

      container.innerHTML = `
        <h2 class="h3 fw-bold mb-4">
          <i class="bi bi-clipboard-check text-success"></i> ${escapeHtml(item.title)}
        </h2>
        <div class="card border-0 shadow-sm rounded-4 p-5 text-center">
          <i class="bi bi-clipboard-check text-success" style="font-size: 5rem;"></i>
          <h4 class="mt-3">${escapeHtml(item.title)}</h4>
          <div class="d-flex justify-content-center gap-4 my-3">
            <div>
              <strong class="fs-4">${item.timeLimit}</strong><br>
              <small class="text-muted">دقيقة</small>
            </div>
            ${bestScore !== null
              ? `<div>
                   <strong class="fs-4 text-success">${bestScore}%</strong><br>
                   <small class="text-muted">أفضل نتيجة</small>
                 </div>`
              : ""}
          </div>
          <a href="quiz.html?id=${item.id}" class="btn btn-success btn-lg mt-3">
            <i class="bi bi-play-circle"></i>
            ${quizAttempts.length > 0 ? "إعادة الاختبار" : "ابدأ الاختبار"}
          </a>
        </div>
      `;
    }
  }

  // ==========================================================
  // Actions
  // ==========================================================
  async function completeLesson() {
    if (!currentItem || currentItem.type !== "lesson") return;

    const { error } = await markLessonComplete(currentUser.id, currentCourse.id, currentItem.id);
    if (error) {
      alert("خطأ: " + error);
      return;
    }

    await renderSidebar();
    await updateProgress();
    await loadItem(currentItem);
  }

  async function updateProgress() {
    const lessons = allItems.filter(i => i.type === "lesson");
    const progress = await getLessonProgress(currentUser.id, currentCourse.id);
    const completedCount = progress.filter(p => p.completed).length;
    const pct = lessons.length > 0 ? Math.round((completedCount / lessons.length) * 100) : 0;

    document.getElementById("progressPct").textContent = pct + "%";
    document.getElementById("progressBar").style.width = pct + "%";
  }

  function goNext() {
    const idx = allItems.findIndex(i => i.type === currentItem.type && i.id === currentItem.id);
    if (idx >= 0 && idx < allItems.length - 1) {
      loadItem(allItems[idx + 1]);
    }
  }

  document.addEventListener("DOMContentLoaded", initLearn);
</script>
</body>
</html>
