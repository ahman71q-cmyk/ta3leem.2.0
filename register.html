<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب | Ta3leem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; background: var(--gradient-soft); }
    .auth-card { width: 100%; max-width: 500px; border-radius: 20px; border: none; box-shadow: 0 15px 50px rgba(14, 165, 233, 0.15); }
    .brand-logo { width: 70px; height: 70px; border-radius: 50%; background: var(--gradient-brand); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 2rem; margin: 0 auto 1rem; }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="card auth-card">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-logo"><i class="bi bi-mortarboard-fill"></i></div>
          <h3 class="fw-bold mb-1">إنشاء حساب جديد</h3>
          <p class="text-muted small mb-0">انضم إلينا مجانًا وابدأ التعلم</p>
        </div>

        <div id="alertBox"></div>

        <form onsubmit="registerUser(event)" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold">الاسم الكامل</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
              <input type="text" name="fullName" class="form-control border-start-0" placeholder="مثال: أحمد محمد" required minlength="3">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">البريد الإلكتروني</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
              <input type="email" name="email" class="form-control border-start-0" placeholder="example@email.com" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">السنة الدراسية *</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-mortarboard text-muted"></i></span>
              <select name="grade" class="form-select border-start-0" required>
                <option value="">اختر سنتك الدراسية</option>
                <optgroup label="المرحلة الإعدادية">
                  <option value="prep1">الأول الإعدادي</option>
                  <option value="prep2">الثاني الإعدادي</option>
                  <option value="prep3">الثالث الإعدادي</option>
                </optgroup>
                <optgroup label="المرحلة الثانوية">
                  <option value="sec1">الأول الثانوي</option>
                  <option value="sec2">الثاني الثانوي</option>
                  <option value="sec3">الثالث الثانوي</option>
                </optgroup>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">كلمة المرور</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
              <input type="password" name="password" id="passwordInput" class="form-control border-start-0" placeholder="6 أحرف على الأقل" required minlength="6">
              <button type="button" class="btn btn-outline-secondary border-start-0" onclick="togglePassword('passwordInput', this)"><i class="bi bi-eye"></i></button>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">تأكيد كلمة المرور</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
              <input type="password" name="confirmPassword" id="confirmPasswordInput" class="form-control border-start-0" placeholder="••••••••" required>
              <button type="button" class="btn btn-outline-secondary border-start-0" onclick="togglePassword('confirmPasswordInput', this)"><i class="bi bi-eye"></i></button>
            </div>
          </div>

          <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="terms" required>
            <label class="form-check-label small" for="terms">أوافق على الشروط والأحكام</label>
          </div>

          <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
            <i class="bi bi-person-plus"></i> إنشاء الحساب
          </button>

          <div class="text-center">
            <small class="text-muted">لديك حساب بالفعل؟ <a href="login.html" class="fw-semibold text-decoration-none">سجّل دخولك</a></small>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function togglePassword(id, btn) {
      const i = document.getElementById(id);
      const ic = btn.querySelector("i");
      if (i.type === "password") { i.type = "text"; ic.className = "bi bi-eye-slash"; }
      else { i.type = "password"; ic.className = "bi bi-eye"; }
    }
  </script>
</body>
</html>
