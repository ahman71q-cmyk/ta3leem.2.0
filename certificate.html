<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الشهادة | Ta3leem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0ea5e9">
  <style>
    body { background: #f1f5f9; }
    .cert-wrap { max-width: 900px; margin: 2rem auto; padding: 1rem; }
    .cert {
      background: #fff; border-radius: 20px; padding: 3rem 3rem 2rem;
      position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.1);
      overflow: hidden; border: 8px solid transparent;
      background-image: linear-gradient(#fff, #fff), linear-gradient(135deg, #0ea5e9, #10b981);
      background-origin: border-box; background-clip: padding-box, border-box;
    }
    .cert::before {
      content: ''; position: absolute; inset: 20px;
      border: 2px dashed #cbd5e1; border-radius: 12px; pointer-events: none;
    }
    .cert-logo { font-size: 3rem; color: #0ea5e9; margin-bottom: 0.5rem; }
    .cert-title {
      font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 2.5rem;
      background: linear-gradient(135deg, #0ea5e9, #10b981);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .cert-subtitle {
      font-family: 'Cairo', sans-serif; font-size: 1rem; color: #64748b;
      letter-spacing: 3px; text-transform: uppercase;
    }
    .cert-text { font-size: 1.1rem; color: #475569; line-height: 1.9; margin: 1rem 0; }
    .cert-name {
      font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 2.5rem;
      color: #0f172a; margin: 1.5rem auto; padding-bottom: 1rem;
      border-bottom: 3px solid #e2e8f0; max-width: 500px;
    }
    .cert-course { font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 1.6rem; color: #0ea5e9; }
    .cert-footer {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid #e2e8f0;
      position: relative;
    }
    .cert-signature { text-align: center; min-width: 200px; }
    .cert-signature .sig-line { width: 180px; height: 2px; background: #0f172a; margin: 0.5rem auto; }
    .cert-signature .sig-name {
      font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 1.1rem;
      color: #0f172a; margin-bottom: 0.25rem;
    }
    .cert-signature .sig-title { font-size: 0.85rem; color: #64748b; }
    .cert-stamp {
      position: absolute; bottom: 30px; left: 40px;
      width: 130px; height: 130px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transform: rotate(-8deg); opacity: 0.9;
    }
    .stamp-inner {
      width: 100%; height: 100%; border: 3px dashed #0ea5e9; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 8px; background: rgba(14, 165, 233, 0.05);
    }
    .stamp-inner .stamp-icon { font-size: 1.8rem; color: #0ea5e9; margin-bottom: 2px; }
    .stamp-inner .stamp-text {
      font-family: 'Cairo', sans-serif; font-size: 0.65rem;
      font-weight: 700; color: #0284c7; text-align: center; line-height: 1.2;
    }
    .cert-code-box {
      display: inline-block; padding: 6px 16px; background: #f1f5f9;
      border-radius: 20px; font-family: monospace;
      font-size: 0.85rem; color: #475569; margin-top: 0.5rem;
    }
    @media print {
      body { background: #fff; }
      .no-print { display: none !important; }
      .cert-wrap { margin: 0; padding: 0; max-width: 100%; }
      .cert { box-shadow: none; border-radius: 0; page-break-inside: avoid; }
      @page { size: A4 landscape; margin: 0; }
    }
    @media (max-width: 768px) {
      .cert { padding: 1.5rem; }
      .cert-title { font-size: 1.75rem; }
      .cert-name { font-size: 1.75rem; }
      .cert-course { font-size: 1.2rem; }
      .cert-footer { flex-direction: column; gap: 1.5rem; align-items: center; }
      .cert-stamp { width: 100px; height: 100px; position: static; transform: none; margin: 1rem auto; }
    }
  </style>
</head>
<body>
  <div class="cert-wrap">
    <div class="d-flex justify-content-between mb-3 no-print">
      <a href="dashboard.html" class="btn btn-outline-primary">
        <i class="bi bi-arrow-right"></i> رجوع للوحة
      </a>
      <button class="btn btn-primary" onclick="window.print()">
        <i class="bi bi-printer"></i> تحميل PDF
      </button>
    </div>

    <div class="cert text-center">
      <i class="bi bi-mortarboard-fill text-primary" style="font-size: 3rem;"></i>
      <div class="cert-subtitle" id="platformName">TA3LEEM</div>

      <h1 class="cert-title">شهادة إتمام</h1>

      <p class="cert-text mb-0">تشهد منصة <strong id="platformNameAr">تعليم</strong> بأن</p>

      <h2 class="cert-name" id="studentName">—</h2>

      <p class="cert-text">
        قد أتمّ بنجاح متطلبات دورة
        <br>
        <span class="cert-course" id="courseName">—</span>
        <br>
        وأظهر التزامًا وتفوقًا في إنجاز جميع الدروس والاختبارات المقررة.
      </p>

      <p class="text-muted small mt-3">
        تاريخ الإصدار: <span id="issuedDate">—</span>
      </p>

      <div class="cert-code-box">
        <i class="bi bi-shield-check text-success"></i>
        كود التحقق: <strong id="certCode">—</strong>
      </div>

      <div class="cert-footer">
        <div class="cert-stamp">
          <div class="stamp-inner">
            <i class="bi bi-patch-check-fill stamp-icon"></i>
            <div class="stamp-text" id="stampText">معتمد من Ta3leem</div>
          </div>
        </div>

        <div class="cert-signature">
          <div class="sig-name" id="managerName">أحمد كرم</div>
          <div class="sig-line"></div>
          <div class="sig-title" id="managerTitle">مدير المنصة</div>
        </div>
      </div>
    </div>

    <div class="text-center text-muted small mt-3 no-print">
      للتحقق من صحة الشهادة، استخدم كود التحقق أعلاه.
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async function() {
      const user = await requireAuth();
      if (!user) return;

      document.getElementById("studentName").textContent = user.full_name || user.email;

      // اسم الدورة
      const slug = new URLSearchParams(window.location.search).get("course");
      const allCourses = JSON.parse(localStorage.getItem("ta3leem_admin_courses") || "null") || LOCAL_COURSES;

      let courseName = "—";
      let courseObj = null;

      if (slug) {
        courseObj = allCourses.find(x => x.slug === slug);
        if (courseObj) courseName = courseObj.title;
      } else {
        const lastResult = sessionStorage.getItem("lastQuizResult");
        if (lastResult) {
          try {
            const result = JSON.parse(lastResult);
            if (result.courseTitle) courseName = result.courseTitle;
            if (result.courseId) courseObj = allCourses.find(x => x.id === result.courseId);
          } catch {}
        }
      }
      document.getElementById("courseName").textContent = courseName;

      // التاريخ
      document.getElementById("issuedDate").textContent =
        new Date().toLocaleDateString("ar-EG", { year: "numeric", month: "long", day: "numeric" });

      // ✅ المشكلة 4: كود التحقق
      let certificateCode = "—";
      if (courseObj) {
        const cert = getOrCreateCertificate(
          user.id,
          courseObj.id,
          user.full_name || user.email,
          courseObj.title
        );
        certificateCode = cert.code;
      }
      document.getElementById("certCode").textContent = certificateCode;

      // الإعدادات
      const settings = getSettings();
      document.getElementById("platformName").textContent = (settings.platform_name || "TA3LEEM").toUpperCase();
      document.getElementById("platformNameAr").textContent = settings.platform_name_ar || "تعليم";
      document.getElementById("managerName").textContent = settings.manager_name || "مدير المنصة";
      document.getElementById("managerTitle").textContent = settings.manager_title || "مدير المنصة";
      document.getElementById("stampText").textContent = settings.stamp_text || "معتمد من Ta3leem";

      document.title = `شهادة - ${courseName}`;
    })();
  </script>
</body>
</html>
