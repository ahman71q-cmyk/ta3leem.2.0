<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل الدورة | Ta3leem</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-mortarboard-fill fs-3"></i><span>Ta3leem</span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link fw-semibold" href="index.html">الرئيسية</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold" href="courses.html">الدورات</a></li>
          <a class="nav-link fw-semibold" href="quizzes.html"><i class="bi bi-clipboard-check"></i> الاختبارات</a>
         <a class="nav-link fw-semibold" href="presentations.html"><i class="bi bi-easel"></i> العروض</a>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-sm btn-outline-secondary border-0" onclick="toggleTheme()">
            <i class="bi bi-moon-stars" id="themeIcon"></i>
          </button>
          <div id="guestButtons" class="d-flex gap-2">
            <a href="login.html" class="btn btn-sm btn-outline-primary px-3">دخول</a>
            <a href="register.html" class="btn btn-sm btn-primary px-3">إنشاء حساب</a>
          </div>
          <div id="userMenu" class="dropdown d-none">
            <button class="btn btn-sm btn-light dropdown-toggle" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle"></i>
              <span id="userName">مستخدم</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="dashboard.html">لوحتي</a></li>
              <li><a class="dropdown-item text-danger" href="#" onclick="logout(event)">خروج</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <section class="py-5">
    <div class="container" id="courseDetail">
      <div class="text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p class="text-muted mt-2">جاري تحميل الدورة...</p>
      </div>
    </div>
  </section>

  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center small text-white-50">
      © <span id="currentYear"></span> Ta3leem. جميع الحقوق محفوظة.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/courses.js"></script>
  <script>
    document.getElementById("currentYear").textContent = new Date().getFullYear();

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute("data-bs-theme");
      const next = current === "dark" ? "light" : "dark";
      html.setAttribute("data-bs-theme", next);
      localStorage.setItem("theme", next);
      document.getElementById("themeIcon").className =
        next === "dark" ? "bi bi-sun" : "bi bi-moon-stars";
    }

    (function () {
      const saved = localStorage.getItem("theme") || "light";
      document.documentElement.setAttribute("data-bs-theme", saved);
      document.addEventListener("DOMContentLoaded", () => {
        const icon = document.getElementById("themeIcon");
        if (icon) icon.className = saved === "dark" ? "bi bi-sun" : "bi bi-moon-stars";
      });
    })();
  </script>
</body>
</html>
