  <section class="py-5" style="background: var(--gradient-soft);">
    <div class="container">
      <h1 class="fw-bold mb-2"><i class="bi bi-easel"></i> العروض التقديمية</h1>
      <p class="text-muted mb-0">شاهد العروض التوضيحية والملفات التعليمية</p>
    </div>
  </section>

  <section class="py-5">
    <div class="container">
      <!-- فلتر البحث -->
      <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-body p-3">
          <div class="row g-3 align-items-center">
            <div class="col-md-6">
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" id="searchPresentation" class="form-control border-start-0" placeholder="ابحث عن عرض...">
              </div>
            </div>
            <div class="col-md-6">
              <select id="courseFilter" class="form-select">
                <option value="">كل الدورات</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-4" id="presentationsGrid">
        <div class="col-12 text-center py-5">
          <div class="spinner-border text-primary"></div>
        </div>
      </div>
    </div>
  </section>

  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center small text-white-50">© 2026 Ta3leem. جميع الحقوق محفوظة.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/files.js"></script>
  <script src="js/pwa.js"></script>
  <script>
    let allPresentations = [];
    let currentFilter = { search: "", courseId: "" };

    function filterPresentations() {
      const grid = document.getElementById("presentationsGrid");
      let filtered = [...allPresentations];

      if (currentFilter.courseId) {
        filtered = filtered.filter(p => p.course_id === Number(currentFilter.courseId));
      }

      if (currentFilter.search) {
        const s = currentFilter.search.toLowerCase();
        filtered = filtered.filter(p => p.title.toLowerCase().includes(s));
      }

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-12 text-center py-5">
            <i class="bi bi-search fs-1 text-muted"></i>
            <p class="text-muted mt-2">لا توجد نتائج مطابقة</p>
          </div>`;
        return;
      }

      const allCourses = JSON.parse(localStorage.getItem("ta3leem_admin_courses") || "null") || LOCAL_COURSES;

      grid.innerHTML = filtered.map((p) => {
        const course = allCourses.find(c => c.id === p.course_id);
        const iconClass = p.file_type === "pdf" ? "bi-file-earmark-pdf text-danger" : "bi-file-earmark-ppt text-warning";
        return `
          <div class="col-md-6 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 h-100">
              <div class="card-body p-4">
                <div class="text-center mb-3">
                  <i class="bi ${iconClass}" style="font-size: 3.5rem;"></i>
                </div>
                <h5 class="fw-bold text-center mb-2">${escapeHtml(p.title)}</h5>
                <p class="text-muted small text-center mb-3">${escapeHtml(course?.title || "")}</p>
                <div class="d-flex justify-content-between small text-muted mb-3">
                  <span><i class="bi bi-file-earmark"></i> ${p.file_type.toUpperCase()}</span>
                  <span><i class="bi bi-hdd"></i> ${formatFileSize(p.file_size || 0)}</span>
                </div>
                <button class="btn btn-primary w-100" onclick="openPresentation(${p.id})">
                  <i class="bi bi-box-arrow-up-right"></i> فتح العرض
                </button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function loadPresentations() {
      allPresentations = getAllPresentations();
      const grid = document.getElementById("presentationsGrid");

      if (allPresentations.length === 0) {
        grid.innerHTML = `
          <div class="col-12 text-center py-5">
            <i class="bi bi-easel fs-1 text-muted"></i>
            <h4 class="fw-bold mt-3">لا توجد عروض بعد</h4>
            <p class="text-muted">سيتم إضافة العروض التقديمية قريبًا.</p>
            <a href="courses.html" class="btn btn-primary"><i class="bi bi-book"></i> تصفح الدورات</a>
          </div>`;
        return;
      }

      // فلتر الدورات
      const allCourses = JSON.parse(localStorage.getItem("ta3leem_admin_courses") || "null") || LOCAL_COURSES;
      const coursesWithPres = [...new Set(allPresentations.map(p => p.course_id))];
      const courseFilter = document.getElementById("courseFilter");
      if (courseFilter) {
        courseFilter.innerHTML = '<option value="">كل الدورات</option>' +
          coursesWithPres.map(id => {
            const c = allCourses.find(x => x.id === id);
            return c ? `<option value="${id}">${escapeHtml(c.title)}</option>` : "";
          }).join("");
      }

      courseFilter?.addEventListener("change", e => {
        currentFilter.courseId = e.target.value;
        filterPresentations();
      });

      let timer;
      document.getElementById("searchPresentation")?.addEventListener("input", e => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          currentFilter.search = e.target.value.trim();
          filterPresentations();
        }, 300);
      });

      filterPresentations();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const next = html.getAttribute("data-bs-theme") === "dark" ? "light" : "dark";
      html.setAttribute("data-bs-theme", next);
      localStorage.setItem("theme", next);
      document.getElementById("themeIcon").className = next === "dark" ? "bi bi-sun" : "bi bi-moon-stars";
    }

    (function () {
      const saved = localStorage.getItem("theme") || "light";
      document.documentElement.setAttribute("data-bs-theme", saved);
      document.addEventListener("DOMContentLoaded", () => {
        const i = document.getElementById("themeIcon");
        if (i) i.className = saved === "dark" ? "bi bi-sun" : "bi bi-moon-stars";
        loadPresentations();
      });
    })();
  </script>
</body>
